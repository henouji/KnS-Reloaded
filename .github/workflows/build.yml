name: Build Redirected APK

# Builds a KnS APK whose every Com2uS host points at your mock server, so you can
# run it on a real device without installing apktool/build-tools locally.
# Trigger manually (Actions tab -> Build Redirected APK -> Run workflow) and pass the
# server_url your device can reach, e.g. http://192.168.1.50:8080 (your PC's LAN IP +
# the mock port) or a public URL. Download the signed APK from the run's artifacts.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Mock server base URL the device will reach (e.g. http://192.168.1.50:8080)'
        required: true
        default: 'http://192.168.1.50:8080'

env:
  APKTOOL_VERSION: '2.11.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install apktool + Android build-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign
          curl -fsSL -o /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '#!/usr/bin/env bash\njava -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Re-decode PRISTINE apk
        run: apktool d -f "original/Knights+N+Squires_1.4.0.apk" -o decoded/kns-clean

      - name: Redirect all Com2uS hosts -> mock server
        run: python patch_urls.py "${{ github.event.inputs.server_url }}" decoded/kns-clean

      - name: Rebuild
        run: |
          mkdir -p build
          apktool b decoded/kns-clean -o build/unsigned.apk

      - name: Keystore + sign
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias kns -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass password -keypass password \
            -dname "CN=KnS-Reloaded, OU=Dev, O=Preservation, L=X, S=X, C=US"
          zipalign -f -v 4 build/unsigned.apk build/aligned.apk
          apksigner sign --ks release.keystore --ks-pass pass:password \
            --key-pass pass:password --out build/KnS-redirected.apk build/aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnS-redirected
          path: build/KnS-redirected.apk
